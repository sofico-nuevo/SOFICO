:root{
  --marino:#0A1B2E; --noche:#061119; --alza:#0F2438;
  --azul:#1E4BE8; --azul-claro:#5C7EF6;
  --naranja:#FF8A00; --naranja-alto:#FFAA3B;
  --tinta:#F2F6FA; --tinta-2:#9FB0C6; --tinta-3:#63768F;
  --linea:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--marino);color:var(--tinta);
  font-family:Satoshi,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.035em;line-height:1}
p{margin:0}
ul{margin:0;padding:0;list-style:none}

.wrap{max-width:1020px;margin:0 auto;padding-left:26px;padding-right:26px}
.sec{padding-top:118px;padding-bottom:118px}

.rot{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--naranja);margin:0 0 26px}
.h2{font-size:clamp(2rem,5vw,3.2rem);max-width:16ch}
.txt{color:var(--tinta-2);font-size:19px;margin-top:22px;max-width:48ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;
  border-radius:999px;border:0;cursor:pointer;font-family:inherit;font-size:16.5px;font-weight:700;
  text-decoration:none;transition:background .16s,transform .16s,border-color .16s,color .16s}
.btn-p{background:var(--naranja);color:#241000}
.btn-p:hover{background:var(--naranja-alto);transform:translateY(-2px)}
.btn-s{background:transparent;color:var(--tinta);border:1.5px solid var(--linea)}
.btn-s:hover{border-color:var(--naranja);color:var(--naranja)}
:focus-visible{outline:3px solid var(--naranja);outline-offset:4px}

header{position:sticky;top:0;z-index:60;background:rgba(10,27,46,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--linea)}
.hd{display:flex;align-items:center;gap:28px;height:74px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{height:32px;width:auto}
.logo b{font-size:19px;font-weight:800;letter-spacing:.22em;display:block;line-height:1}
.logo i{font-style:normal;font-size:8.5px;letter-spacing:.25em;color:var(--tinta-3);text-transform:uppercase;display:block;margin-top:3px}
nav{margin-left:auto;display:flex;gap:28px}
nav a{font-size:14.5px;color:var(--tinta-2);text-decoration:none}
nav a:hover{color:var(--naranja)}
.hd .btn{min-height:44px;padding:0 20px;font-size:14.5px}
@media(max-width:960px){nav{display:none}}

/* ---------- hero: el tiempo como protagonista ---------- */
.hero{padding-top:104px;padding-bottom:96px;position:relative}
.hero-marca{position:absolute;right:2%;top:120px;width:min(250px,30vw);opacity:.9;
  filter:drop-shadow(0 30px 70px rgba(0,0,0,.6));pointer-events:none}
.dias{display:flex;align-items:flex-start;gap:20px;line-height:.82}
.dias b{font-size:clamp(6rem,20vw,13rem);font-weight:800;letter-spacing:-.06em;
  background:linear-gradient(160deg,var(--naranja-alto),var(--naranja) 46%,var(--azul-claro));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.dias span{font-size:clamp(1rem,2.4vw,1.5rem);font-weight:700;color:var(--tinta-2);
  letter-spacing:-.01em;padding-top:.9em;line-height:1.2;max-width:7ch}
.hero h1{font-size:clamp(1.9rem,4.6vw,3.1rem);max-width:19ch;margin-top:30px}
.hero .txt{max-width:42ch}
.precio-l{display:flex;gap:46px;flex-wrap:wrap;margin-top:46px;padding-top:30px;border-top:1px solid var(--linea)}
.pl-k{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-3)}
.pl-v{font-size:clamp(2.1rem,4.6vw,2.9rem);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:8px}
.pl-v small{font-size:.44em;vertical-align:.5em;color:var(--tinta-2);margin-right:.06em}
.pl-n{color:var(--tinta-3);font-size:14.5px;margin-top:6px}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:44px}
@media(max-width:880px){.hero{padding-top:56px}.hero-marca{position:static;width:130px;margin-bottom:26px}}

/* ---------- firma: la cinta con las estaciones ---------- */
.ruta{position:relative;padding-left:96px}
.cinta{position:absolute;left:22px;top:6px;bottom:6px;width:52px;pointer-events:none}
.cinta svg{height:100%;width:100%}
.est{position:relative;padding-bottom:70px}
.est:last-child{padding-bottom:0}
.est::before{content:"";position:absolute;left:-82px;top:6px;width:18px;height:18px;border-radius:50%;
  background:var(--marino);border:2.5px solid var(--naranja);z-index:2}
.est:nth-child(2)::before{border-color:#C97A3C}
.est:nth-child(3)::before{border-color:#6E6BC0}
.est:nth-child(4)::before{border-color:var(--azul-claro)}
.est-dia{font-size:12.5px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--naranja)}
.est:nth-child(3) .est-dia{color:#8D8AD8}
.est:nth-child(4) .est-dia{color:var(--azul-claro)}
.est h3{font-size:clamp(1.35rem,3vw,1.85rem);margin-top:12px}
.est p{color:var(--tinta-2);font-size:17px;margin-top:12px;max-width:44ch}
@media(max-width:620px){
  .ruta{padding-left:52px}
  .cinta{left:0;width:30px}
  .est::before{left:-44px;width:15px;height:15px}
}

/* ---------- incluye: lista tipográfica, sin cajas ---------- */
.lista{margin-top:52px;border-top:1px solid var(--linea)}
.lista li{display:flex;gap:22px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--linea)}
.lista i{font-style:normal;font-size:12.5px;font-weight:700;color:var(--tinta-3);min-width:26px;letter-spacing:.08em}
.lista p{font-size:clamp(1.02rem,2.1vw,1.28rem);font-weight:500;letter-spacing:-.015em;line-height:1.4}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;
  margin-top:40px;padding:28px 32px;border-radius:16px;background:var(--alza);border:1px solid var(--linea)}
.total span{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-3)}
.total b{font-size:clamp(2.2rem,5vw,3rem);font-weight:800;letter-spacing:-.04em;color:var(--naranja);line-height:1}
.total b small{font-size:.44em;vertical-align:.5em;color:var(--tinta-2);margin-right:.06em}
.bono{margin-top:22px;font-size:16px;color:var(--tinta-2);padding-left:22px;border-left:2px solid var(--naranja)}

/* ---------- cifras ---------- */
.cifras{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--linea);border-bottom:1px solid var(--linea)}
.cifra{flex:1 1 210px;padding:46px 30px 46px 0}
.cifra+.cifra{border-left:1px solid var(--linea);padding-left:30px}
.cifra b{display:block;font-size:clamp(2.3rem,5vw,3.2rem);font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--naranja)}
.cifra span{display:block;color:var(--tinta-3);font-size:15px;margin-top:10px}
@media(max-width:720px){.cifra{flex:1 1 100%;padding:28px 0}
  .cifra+.cifra{border-left:0;border-top:1px solid var(--linea);padding-left:0}}

/* ---------- beneficios y nosotros ---------- */
.abre{margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:0 44px}
.abre li{padding:18px 0;border-bottom:1px solid var(--linea);font-size:17px;display:flex;gap:14px}
.abre li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--azul-claro);margin-top:.6em;flex-shrink:0}
@media(max-width:640px){.abre{grid-template-columns:1fr}}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px}
.mv h3{font-size:12.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--naranja)}
.mv p{margin-top:14px;color:var(--tinta-2);font-size:17px}
.otros{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:52px}
.otro{border:1px solid var(--linea);border-radius:16px;padding:26px;background:var(--alza)}
.otro h3{font-size:18px}
.otro p{color:var(--tinta-3);font-size:15.5px;margin-top:9px}
@media(max-width:700px){.mv,.otros{grid-template-columns:1fr}}

/* ---------- contacto ---------- */
.cierre{background:var(--alza);border-radius:24px;padding:56px 48px;margin-top:0;
  border:1px solid var(--linea)}
.cont{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:42px;align-items:start}
.dato{padding:16px 0;border-bottom:1px solid var(--linea)}
.dato:first-child{border-top:1px solid var(--linea)}
.dato-k{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-3)}
.dato-v{font-size:17.5px;font-weight:500;margin-top:6px}
.dato-v a{text-decoration:none}
.dato-v a:hover{color:var(--naranja)}
form{display:flex;flex-direction:column}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.campo{display:flex;flex-direction:column;gap:7px}
.campo.ancho{grid-column:1/-1}
label{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3)}
input,textarea{font-family:inherit;font-size:16px;color:var(--tinta);background:rgba(0,0,0,.3);
  border:1px solid var(--linea);border-radius:10px;padding:14px;min-height:50px;width:100%}
textarea{min-height:104px;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--naranja)}
form .btn{margin-top:20px}
.form-nota{font-size:13.5px;color:var(--tinta-3);margin-top:13px;text-align:center}
@media(max-width:880px){.cont{grid-template-columns:1fr;gap:36px}.cierre{padding:38px 26px;border-radius:18px}}
@media(max-width:520px){.campos{grid-template-columns:1fr}}

footer{border-top:1px solid var(--linea);background:var(--noche);margin-top:110px}
.pie{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap;padding-top:52px;padding-bottom:26px}
.pie-redes{display:flex;gap:20px}
.pie-redes a{font-size:14.5px;color:var(--tinta-2);text-decoration:none}
.pie-redes a:hover{color:var(--naranja)}
.legal{border-top:1px solid var(--linea);padding-top:22px;padding-bottom:34px;display:flex;
  justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--tinta-3);line-height:1.55}
.legal p{max-width:62ch}



/* ---------- menú de secciones en celular ---------- */
.menu-btn{display:none;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 15px;margin-left:6px;flex-shrink:0;cursor:pointer;
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.32);
  border-radius:999px;color:var(--tinta);
  font-family:inherit;font-size:14.5px;font-weight:700;letter-spacing:.01em}
.menu-btn:hover{background:rgba(255,255,255,.22);border-color:var(--naranja);color:var(--naranja)}
.menu-btn[aria-expanded="true"]{background:var(--naranja);border-color:var(--naranja);color:#241000}
.menu-btn svg{width:18px;height:18px;flex-shrink:0}
.menu-btn .ic-x{display:none}
.menu-btn[aria-expanded="true"] .ic-lineas{display:none}
.menu-btn[aria-expanded="true"] .ic-x{display:block}
.menu-movil{position:absolute;left:0;right:0;top:100%;background:var(--marino);
  border-bottom:1px solid var(--linea);box-shadow:0 22px 40px -18px rgba(0,0,0,.8)}
.menu-movil a{display:flex;align-items:center;justify-content:space-between;
  min-height:56px;padding:0 22px;font-size:17px;font-weight:500;color:var(--tinta);
  text-decoration:none;border-bottom:1px solid var(--linea)}
.menu-movil a:last-child{border-bottom:0}
.menu-movil a:active,.menu-movil a:hover{color:var(--naranja);background:rgba(255,255,255,.035)}
.menu-movil a::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--tinta-3);
  border-bottom:1.5px solid var(--tinta-3);transform:rotate(-45deg)}
@media(max-width:960px){.menu-btn{display:inline-flex}}


/* la cabecera debe entrar en pantallas angostas sin recortarse ni desbordar */
@media(max-width:520px){
  .wrap{padding-left:18px;padding-right:18px}
  .hd{gap:10px}
  .logo{gap:9px;min-width:0}
  .logo img{height:29px}
  .logo b{font-size:16.5px;letter-spacing:.15em}
  .logo i,.logo span span{font-size:7.5px;letter-spacing:.18em}
  .menu-btn{height:40px;padding:0 12px;gap:6px;font-size:13.5px;margin-left:4px}
  .hd .btn{padding:0 14px;font-size:14px;min-height:40px}
}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.entra{opacity:0;transform:translateY(18px);animation:sube .8s cubic-bezier(.2,.7,.3,1) forwards}
.entra.d1{animation-delay:.09s}.entra.d2{animation-delay:.18s}
@keyframes sube{to{opacity:1;transform:none}}
</style>

document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const d = new FormData(e.target), g = k => (d.get(k)||'').toString().trim();
  location.href = 'mailto:' + C.contacto.correo
    + '?subject=' + encodeURIComponent('Consulta desde la web: ' + g('n') + ' ' + g('a'))
    + '&body=' + encodeURIComponent('Nombres: ' + g('n') + ' ' + g('a') + '\nCorreo: ' + g('c') + '\nTeléfono: ' + g('t') + '\n\n' + g('m'));
});

/* ---- menú de secciones en celular ---- */
(function(){
  const b = document.getElementById('menu-btn'), m = document.getElementById('menu-movil');
  if(!b || !m) return;
  const abrir = v => { m.hidden = !v; b.setAttribute('aria-expanded', v ? 'true' : 'false');
                       b.setAttribute('aria-label', v ? 'Cerrar menú de secciones' : 'Abrir menú de secciones'); };
  b.addEventListener('click', () => abrir(m.hidden));
  m.addEventListener('click', e => { if(e.target.closest('a')) abrir(false); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !m.hidden){ abrir(false); b.focus(); } });
  addEventListener('resize', () => { if(innerWidth > 1000 && !m.hidden) abrir(false); });
})();
</script>
