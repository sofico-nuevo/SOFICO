:root{
  --marino:#0A1B2E; --marino-2:#0E2440; --marino-3:#122C4C;
  --azul:#1E4BE8; --azul-claro:#4C74F2;
  --naranja:#FF8A00; --naranja-alto:#FFA836;
  --tinta:#EDF1F7; --tinta-2:#A9B8CC; --tinta-3:#6F819A;
  --linea:rgba(255,255,255,.10); --linea-fuerte:rgba(255,255,255,.18);
  --papel:#F4F6F9; --papel-tinta:#16283F;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--marino);color:var(--tinta);
  font-family:Satoshi,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{margin:0;line-height:1.08;letter-spacing:-.02em;font-weight:700}
p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* separación de responsabilidades: .wrap solo horizontal, .sec solo vertical */
.wrap{max-width:1160px;margin:0 auto;padding-left:24px;padding-right:24px}
.sec{padding-top:104px;padding-bottom:104px}
.sec-sm{padding-top:64px;padding-bottom:64px}

.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--naranja);display:flex;align-items:center;gap:12px;margin:0 0 22px}
.eyebrow::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(255,138,0,.5),transparent)}
.claro .eyebrow{color:#C2650B}
.claro .eyebrow::after{background:linear-gradient(90deg,rgba(194,101,11,.45),transparent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:0 26px;border-radius:10px;border:0;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:700;text-decoration:none;letter-spacing:-.01em;
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.btn-p{background:var(--naranja);color:#241000;box-shadow:0 10px 26px -12px rgba(255,138,0,.85)}
.btn-p:hover{background:var(--naranja-alto);transform:translateY(-2px)}
.btn-s{background:transparent;color:var(--tinta);border:1px solid var(--linea-fuerte)}
.btn-s:hover{border-color:var(--naranja);color:var(--naranja-alto)}
.claro .btn-s{color:var(--papel-tinta);border-color:rgba(22,40,63,.28)}
.claro .btn-s:hover{border-color:#C2650B;color:#C2650B}
:focus-visible{outline:3px solid var(--naranja);outline-offset:3px;border-radius:6px}

/* ---------- cabecera ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(10,27,46,.86);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
.hd{display:flex;align-items:center;gap:28px;height:72px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0}
.logo img{height:32px;width:auto}
.logo b{font-size:19px;font-weight:700;letter-spacing:.20em;line-height:1}
.logo span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;
  color:var(--tinta-3);text-transform:uppercase;margin-top:3px}
nav{margin-left:auto;display:flex;gap:26px}
nav a{font-size:14.5px;color:var(--tinta-2);text-decoration:none;padding:6px 0}
nav a:hover{color:var(--naranja)}
.hd .btn{min-height:42px;padding:0 18px;font-size:14.5px}
@media(max-width:980px){nav{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;padding-top:76px;padding-bottom:56px}
.hero-g{display:grid;grid-template-columns:1.12fr .88fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.5rem,5.4vw,4.15rem);font-weight:900}
.hero h1 em{font-style:normal;color:var(--naranja)}
.hero .lead{color:var(--tinta-2);font-size:19px;max-width:33ch;margin-top:22px}

.ficha{margin-top:36px;border:1px solid var(--linea);border-radius:var(--r);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));overflow:hidden}
.ficha-r{display:grid;grid-template-columns:1fr 1fr}
.ficha-c{padding:20px 24px}
.ficha-c+.ficha-c{border-left:1px solid var(--linea)}
.ficha-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-3)}
.ficha-v{font-size:34px;font-weight:900;letter-spacing:-.03em;margin-top:6px;line-height:1}
.ficha-v small{font-size:17px;font-weight:700;color:var(--tinta-2);margin-right:2px}
.ficha-n{font-size:13px;color:var(--tinta-3);margin-top:4px}
.ficha-pie{border-top:1px solid var(--linea);padding:12px 24px;font-family:var(--mono);
  font-size:11px;letter-spacing:.1em;color:var(--tinta-3);text-transform:uppercase;
  background:rgba(255,255,255,.02)}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}

.hero-marca{display:flex;justify-content:center}
.hero-marca img{width:min(300px,74%);filter:drop-shadow(0 34px 60px rgba(0,0,0,.55))}
@media(max-width:900px){
  .hero-g{grid-template-columns:1fr;gap:36px}
  .hero-marca{order:-1;justify-content:flex-start}
  .hero-marca img{width:140px}
  .hero{padding-top:48px}
}
@media(max-width:540px){ .ficha-r{grid-template-columns:1fr}
  .ficha-c+.ficha-c{border-left:0;border-top:1px solid var(--linea)} }

/* ---------- firma: estado del expediente ---------- */
.estado{border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);background:rgba(255,255,255,.022)}
.estado-h{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:34px}
.estado-h h2{font-size:23px}
.estado-h span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3)}
.pistas{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.pista{position:relative;padding:0 22px 0 0}
.pista::before{content:"";position:absolute;left:0;top:7px;right:0;height:2px;
  background:linear-gradient(90deg,var(--naranja),rgba(255,138,0,.22))}
.pista:nth-child(2)::before{background:linear-gradient(90deg,rgba(255,138,0,.22),rgba(76,116,242,.32))}
.pista:nth-child(3)::before{background:linear-gradient(90deg,rgba(76,116,242,.32),rgba(76,116,242,.5))}
.pista:nth-child(4)::before{background:linear-gradient(90deg,rgba(76,116,242,.5),var(--azul-claro))}
.punto{width:16px;height:16px;border-radius:50%;background:var(--marino);
  border:2px solid var(--naranja);position:relative;z-index:2;margin-bottom:20px}
.pista:nth-child(n+3) .punto{border-color:var(--azul-claro)}
.pista-dia{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--naranja);text-transform:uppercase}
.pista:nth-child(n+3) .pista-dia{color:var(--azul-claro)}
.pista-t{font-weight:700;font-size:16.5px;margin-top:7px;letter-spacing:-.01em}
.pista-d{color:var(--tinta-3);font-size:14px;margin-top:6px;max-width:26ch}
@media(max-width:820px){
  .pistas{grid-template-columns:1fr;gap:28px}
  .pista{padding:0 0 0 30px}
  .pista::before{left:7px;top:0;bottom:-28px;right:auto;width:2px;height:auto;
    background:linear-gradient(180deg,var(--naranja),rgba(76,116,242,.5))!important}
  .pista:last-child::before{display:none}
  .punto{position:absolute;left:0;top:2px;margin:0}
  .pista-d{max-width:none}
}

/* ---------- qué incluye ---------- */
.claro{background:var(--papel);color:var(--papel-tinta)}
.claro h2,.claro h3{color:var(--papel-tinta)}
.tit{font-size:clamp(1.85rem,3.4vw,2.6rem);font-weight:900;max-width:20ch}
.sub{color:var(--tinta-2);margin-top:16px;font-size:17.5px;max-width:52ch}
.claro .sub{color:#4A5D74}

.items{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:44px;
  border-top:1px solid rgba(22,40,63,.13)}
.item{display:flex;gap:16px;padding:20px 26px 20px 0;border-bottom:1px solid rgba(22,40,63,.13)}
.item:nth-child(odd){border-right:1px solid rgba(22,40,63,.13);padding-right:34px}
.item:nth-child(even){padding-left:34px}
.item-n{font-family:var(--mono);font-size:11.5px;color:#C2650B;padding-top:4px;flex-shrink:0;letter-spacing:.08em}
.item-t{font-size:16.5px;font-weight:500;line-height:1.45}
@media(max-width:760px){
  .items{grid-template-columns:1fr}
  .item,.item:nth-child(odd),.item:nth-child(even){padding-left:0;padding-right:0;border-right:0}
}
.bono{margin-top:38px;display:flex;gap:20px;align-items:flex-start;
  background:#FFF3E2;border-left:4px solid var(--naranja);border-radius:0 12px 12px 0;padding:22px 26px}
.bono h3{font-size:17px}
.bono p{color:#5A4630;font-size:15.5px;margin-top:6px}

/* ---------- razones ---------- */
.rejilla{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:46px}
.tarjeta{border:1px solid var(--linea);border-radius:var(--r);padding:26px 24px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
.tarjeta h3{font-size:17px}
.tarjeta p{color:var(--tinta-3);font-size:14.5px;margin-top:9px}
.tarjeta-n{font-family:var(--mono);font-size:11px;color:var(--naranja);letter-spacing:.14em;margin-bottom:14px}
@media(max-width:900px){.rejilla{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.rejilla{grid-template-columns:1fr}}

/* ---------- cifras ---------- */
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
  border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;gap:0}
.cifra{padding:38px 30px;text-align:center}
.cifra+.cifra{border-left:1px solid var(--linea)}
.cifra b{display:block;font-size:clamp(2.1rem,4.4vw,3rem);font-weight:900;letter-spacing:-.03em;
  color:var(--naranja);line-height:1}
.cifra span{display:block;color:var(--tinta-3);font-size:14.5px;margin-top:10px}
@media(max-width:700px){.cifras{grid-template-columns:1fr}
  .cifra+.cifra{border-left:0;border-top:1px solid var(--linea)}}

/* ---------- nosotros ---------- */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px}
.panel{border:1px solid rgba(22,40,63,.14);border-radius:var(--r);padding:28px;background:#fff}
.panel-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#C2650B}
.panel p{margin-top:12px;font-size:16px;color:#3E5069}
.panel p{color:#3E5069}
.benef{margin-top:44px;display:flex;flex-wrap:wrap;gap:10px}
.benef li{border:1px solid rgba(22,40,63,.16);border-radius:999px;padding:9px 18px;font-size:14.5px}
@media(max-width:760px){.dos{grid-template-columns:1fr}}

/* ---------- contacto ---------- */
.cont{display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;margin-top:44px;align-items:start}
.dato{border-bottom:1px solid var(--linea);padding:16px 0}
.dato:first-child{border-top:1px solid var(--linea)}
.dato-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-3)}
.dato-v{font-size:17px;font-weight:500;margin-top:5px}
.dato-v a{text-decoration:none}
.dato-v a:hover{color:var(--naranja)}
form{border:1px solid var(--linea);border-radius:var(--r);padding:30px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.campo{display:flex;flex-direction:column;gap:7px}
.campo.ancho{grid-column:1/-1}
label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3)}
input,textarea{font-family:inherit;font-size:16px;color:var(--tinta);background:rgba(0,0,0,.24);
  border:1px solid var(--linea);border-radius:9px;padding:13px 14px;min-height:48px;width:100%}
textarea{min-height:104px;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:var(--naranja)}
form .btn{width:100%;margin-top:20px}
.form-nota{font-size:13px;color:var(--tinta-3);margin-top:14px;text-align:center}
@media(max-width:860px){.cont{grid-template-columns:1fr;gap:36px}}
@media(max-width:540px){.campos{grid-template-columns:1fr}}

/* ---------- pie ---------- */
footer{border-top:1px solid var(--linea);background:#07131F}
.pie{display:flex;justify-content:space-between;align-items:flex-start;gap:36px;flex-wrap:wrap;
  padding-top:52px;padding-bottom:26px}
.pie-redes{display:flex;gap:18px}
.pie-redes a{font-size:14px;color:var(--tinta-2);text-decoration:none}
.pie-redes a:hover{color:var(--naranja)}
.legal{border-top:1px solid var(--linea);padding-top:22px;padding-bottom:34px;
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:12.5px;color:var(--tinta-3);line-height:1.55}
.legal p{max-width:62ch}



/* ---------- menú de secciones en celular ---------- */
.menu-btn{display:none;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 15px;margin-left:6px;flex-shrink:0;cursor:pointer;
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.32);
  border-radius:10px;color:var(--tinta);
  font-family:inherit;font-size:14.5px;font-weight:700;letter-spacing:.01em}
.menu-btn:hover{background:rgba(255,255,255,.22);border-color:var(--naranja);color:var(--naranja)}
.menu-btn[aria-expanded="true"]{background:var(--naranja);border-color:var(--naranja);color:#241000}
.menu-btn svg{width:18px;height:18px;flex-shrink:0}
.menu-btn .ic-x{display:none}
.menu-btn[aria-expanded="true"] .ic-lineas{display:none}
.menu-btn[aria-expanded="true"] .ic-x{display:block}
.menu-movil{position:absolute;left:0;right:0;top:100%;background:var(--marino);
  border-bottom:1px solid var(--linea);box-shadow:0 22px 40px -18px rgba(0,0,0,.8)}
.menu-movil a{display:flex;align-items:center;justify-content:space-between;
  min-height:56px;padding:0 22px;font-size:17px;font-weight:500;color:var(--tinta);
  text-decoration:none;border-bottom:1px solid var(--linea)}
.menu-movil a:last-child{border-bottom:0}
.menu-movil a:active,.menu-movil a:hover{color:var(--naranja);background:rgba(255,255,255,.035)}
.menu-movil a::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--tinta-3);
  border-bottom:1.5px solid var(--tinta-3);transform:rotate(-45deg)}
@media(max-width:980px){.menu-btn{display:inline-flex}}


/* la cabecera debe entrar en pantallas angostas sin recortarse ni desbordar */
@media(max-width:520px){
  .wrap{padding-left:18px;padding-right:18px}
  .hd{gap:10px}
  .logo{gap:9px;min-width:0}
  .logo img{height:29px}
  .logo b{font-size:16.5px;letter-spacing:.15em}
  .logo i,.logo span span{font-size:7.5px;letter-spacing:.18em}
  .menu-btn{height:40px;padding:0 12px;gap:6px;font-size:13.5px;margin-left:4px}
  .hd .btn{padding:0 14px;font-size:14px;min-height:40px}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}
.entra{opacity:0;transform:translateY(14px);animation:sube .7s cubic-bezier(.2,.7,.3,1) forwards}
.entra:nth-child(2){animation-delay:.07s}.entra:nth-child(3){animation-delay:.14s}
@keyframes sube{to{opacity:1;transform:none}}
</style>

document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const d = new FormData(e.target), g = k => (d.get(k)||'').toString().trim();
  location.href = 'mailto:' + C.contacto.correo
    + '?subject=' + encodeURIComponent('Consulta desde la web: ' + g('n') + ' ' + g('a'))
    + '&body=' + encodeURIComponent(
        'Nombres: ' + g('n') + ' ' + g('a') + '\nCorreo: ' + g('c') + '\nTeléfono: ' + g('t') + '\n\n' + g('m'));
});

/* ---- menú de secciones en celular ---- */
(function(){
  const b = document.getElementById('menu-btn'), m = document.getElementById('menu-movil');
  if(!b || !m) return;
  const abrir = v => { m.hidden = !v; b.setAttribute('aria-expanded', v ? 'true' : 'false');
                       b.setAttribute('aria-label', v ? 'Cerrar menú de secciones' : 'Abrir menú de secciones'); };
  b.addEventListener('click', () => abrir(m.hidden));
  m.addEventListener('click', e => { if(e.target.closest('a')) abrir(false); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !m.hidden){ abrir(false); b.focus(); } });
  addEventListener('resize', () => { if(innerWidth > 1000 && !m.hidden) abrir(false); });
})();
</script>
